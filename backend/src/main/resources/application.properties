spring.application.name=backend

# --- PostgreSQL (デフォルト) ---
# docker-compose up -d db でコンテナを起動してから使用する。
# 値は環境変数（SPRING_DATASOURCE_URL 等）で上書き可能。
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/taskboard}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:taskboard}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:change-me}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Dockerを使わずに素早く疎通確認したい場合は "h2" プロファイルで起動する。
# 例: ./gradlew bootRun --args='--spring.profiles.active=h2'
