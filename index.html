<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Board</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <h1>📋 Task Board</h1>
  </header>

  <main id="board" class="board">
    <!-- リスト（列）はJSで動的に生成 -->
  </main>

  <template id="list-template">
    <section class="list" draggable="false">
      <div class="list-header">
        <input class="list-title" type="text" />
        <button class="list-delete" title="リストを削除">✕</button>
      </div>
      <div class="cards"></div>
      <button class="add-card">+ カードを追加</button>
    </section>
  </template>

  <template id="card-template">
    <div class="card" draggable="true">
      <div class="card-main">
        <input class="card-title" type="text" />
        <button class="card-delete" title="カードを削除">✕</button>
      </div>
      <div class="card-meta">
        <select class="card-priority" title="優先度">
          <option value="high">🔴 高</option>
          <option value="medium">🟡 中</option>
          <option value="low">🟢 低</option>
        </select>
        <input class="card-due" type="date" title="期限" />
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
